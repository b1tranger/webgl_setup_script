<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 2: WebGL 2D Game Sprite</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #canvas-container {
      position: relative;
      border: 2px solid #58a6ff;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block;
      width: 800px;
      height: 600px;
      outline: none;
    }
    .instructions {
      margin-top: 12px;
      font-size: 14px;
      color: #8b949e;
      text-align: center;
    }
    .instructions kbd {
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      color: #f0f6fc;
    }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #7ee787;
    }
  </style>
</head>
<body>
  <h2>Lab 2: WebGL 2D Game Sprite with Web Audio</h2>
  <div id="canvas-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <div class="instructions">
    Controls: <kbd>A</kbd>/<kbd>D</kbd> or <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> to Move &bull; <kbd>SPACE</kbd> or <kbd>W</kbd> to Jump (plays synthesized Web Audio tone)
  </div>
  <div id="status">Status: Initializing WebAssembly runtime...</div>

  <script type="text/javascript">
    var statusElement = document.getElementById('status');
    var Module = {
      preRun: [],
      postRun: [],
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        return canvas;
      })(),
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        statusElement.innerHTML = text ? text : 'Status: Ready (Running)';
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
  </script>
  {{{ SCRIPT }}}
</body>
</html>
